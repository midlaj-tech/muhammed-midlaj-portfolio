name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'admin.html'
      - 'admin.js'
      - 'admin.css'
      - 'script.js'
      - 'styles.css'
      - 'data-store.js'
      - 'api/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Copy Built Web Assets to Android Assets Directory
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/
          cp -r dist/* android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Package Universal & Device APKs
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/AdminStudio-Android.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/AdminStudio-Pixel8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdminStudio-Android-APK
          path: dist-apk/*.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "📱 Admin Studio for Android (Universal APK)"
          body: |
            ### 📱 Admin Studio for Android (Universal APK)
            
            - **Universal Android Compatibility**: Optimized for all modern Android devices (Google Pixel, Samsung Galaxy, OnePlus, Xiaomi, Nothing, etc.).
            - **Native Device Biometrics**: Single-line authentication status with universal verified checkmark (`✓`).
            - **First-Time Setup Flow**: On first launch, log in using your admin credentials, then opt-in to device biometrics for future unlocks.
            - **Real-Time Cross-Device Sync**: Immediate cloud synchronization of link clicks, direct messages, and telemetry across Mac and mobile.
            - **Complete Admin Studio Controls**: Manage Skills, Projects, Blogs, Now Engineering, Direct Messages, and Telemetry.
            
            #### 📥 Download & Installation:
            1. Download **`AdminStudio-Android.apk`** below directly to your device.
            2. Open the downloaded file and select **Install**.
            3. Sign in with your master credentials and enable Biometrics when prompted!
          files: |
            dist-apk/AdminStudio-Android.apk
            dist-apk/AdminStudio-Pixel8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
