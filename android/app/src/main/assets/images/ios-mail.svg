<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ios-mail-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2AA0F5"/>
      <stop offset="100%" stop-color="#0864E6"/>
    </linearGradient>
    <linearGradient id="ios-mail-flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EEF5"/>
    </linearGradient>
    <filter id="ios-mail-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#002D75" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- Apple Squircle Base -->
  <rect width="100" height="100" rx="22.5" fill="url(#ios-mail-bg)"/>
  <rect width="98" height="98" x="1" y="1" rx="21.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
  
  <!-- Envelope Icon -->
  <g filter="url(#ios-mail-shadow)">
    <!-- Main Envelope Body -->
    <rect x="18" y="27" width="64" height="46" rx="6.5" fill="#FFFFFF"/>
    <!-- Fold Crease Lines -->
    <path d="M19 33 L50 56 L81 33" fill="none" stroke="#D1DEED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19 71 L40 52" fill="none" stroke="#E1ECF7" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M81 71 L60 52" fill="none" stroke="#E1ECF7" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Top Flap -->
    <path d="M19.5 29 C19.5 27.6 20.8 27 22.2 27 L77.8 27 C79.2 27 80.5 27.6 80.5 29 L51.7 52.2 C50.7 53 49.3 53 48.3 52.2 Z" fill="url(#ios-mail-flap)"/>
    <path d="M19.5 29 L48.3 52.2 C49.3 53 50.7 53 51.7 52.2 L80.5 29" fill="none" stroke="#C2D5E8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
